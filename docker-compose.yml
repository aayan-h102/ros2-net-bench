# Containers on their own bridge network:
#   echo         = the rover (echoes every probe back)
#   logger       = the base station (sends probes, measures the link, writes results)
#   zenoh-router = discovery router, only used when RMW_IMPLEMENTATION=rmw_zenoh_cpp
#
# NETEM_PROFILE (none | near | mid | far | custom) impairs the link on echo and logger.
# RMW_IMPLEMENTATION (rmw_fastrtps_cpp | rmw_zenoh_cpp) picks the ROS 2 middleware.

x-bench-env: &bench-env
  NETEM_PROFILE: ${NETEM_PROFILE:-none}
  NETEM_ARGS: ${NETEM_ARGS:-}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
  ZENOH_CONFIG_OVERRIDE: 'listen/endpoints=["tcp/0.0.0.0:0"];connect/endpoints=["tcp/zenoh-router:7447"]'

services:
  zenoh-router:
    build: .
    image: ros2-net-bench:latest
    command: ["ros2", "run", "rmw_zenoh_cpp", "rmw_zenohd"]
    environment:
      NETEM_PROFILE: none
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
    networks: [benchnet]

  echo:
    build: .
    image: ros2-net-bench:latest
    depends_on: [zenoh-router]
    cap_add: [NET_ADMIN]          # needed for tc/netem
    environment: *bench-env
    networks: [benchnet]
    restart: unless-stopped

  logger:
    build: .
    image: ros2-net-bench:latest
    depends_on: [echo]
    cap_add: [NET_ADMIN]
    entrypoint: ["/scripts/entrypoint.sh", "python3", "-m", "net_bench.logger_node"]
    command: ["--duration", "30"]
    environment:
      <<: *bench-env
      HOST_UID: ${HOST_UID:-0}
      HOST_GID: ${HOST_GID:-0}
    volumes:
      - ./results:/results
    networks: [benchnet]
    profiles: [manual]            # only runs when called with `docker compose run logger`

networks:
  benchnet:
    driver: bridge
